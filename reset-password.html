<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Reset Password | The Forge</title>
  <style>
    :root{color-scheme:dark;--red:#f51d2b;--card:#111;--line:#431116;--muted:#aaa}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#21070a 0,#050505 34%,#000 100%);color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(100%,460px);background:rgba(17,17,17,.96);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
    .eyebrow{font-weight:900;letter-spacing:.2em;color:var(--red);font-size:12px;text-align:center}.bar{height:5px;background:var(--red);border-radius:999px;margin:18px 0 24px}
    h1{text-align:center;margin:0 0 10px;font-size:30px;letter-spacing:.04em;text-transform:uppercase} p{color:var(--muted);line-height:1.55;text-align:center;margin:0 0 24px}
    label{display:block;font-weight:800;font-size:13px;margin:15px 0 7px} input{width:100%;background:#090909;color:white;border:1px solid #333;border-radius:12px;padding:14px 15px;font-size:16px;outline:none}input:focus{border-color:var(--red)}
    button{width:100%;border:0;border-radius:12px;padding:15px 18px;margin-top:20px;background:var(--red);color:#fff;font-size:16px;font-weight:900;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
    .status{margin-top:18px;padding:12px 14px;border-radius:10px;background:#0b0b0b;border:1px solid #292929;color:#ddd;text-align:center;line-height:1.45;display:none}.status.show{display:block}.status.error{border-color:#7a2027;color:#ffd5d8}.status.good{border-color:#285a36;color:#d8ffe2}
    .small{font-size:12px;color:#777;margin-top:18px;text-align:center}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">THE FORGE · NEW JERSEY</div>
    <div class="bar"></div>
    <h1>Reset Password</h1>
    <p id="intro">Choose a new password for your Forge account.</p>
    <form id="form">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required />
      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="8" required />
      <button id="submit" type="submit">SET NEW PASSWORD</button>
    </form>
    <div id="status" class="status" role="status"></div>
    <div class="small">Your password is securely protected and never visible to The Forge.</div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient(
      'https://zgzzuccnlopbkdbsckze.supabase.co',
      'sb_publishable_kXlM1-FcCSiKUVmtmiMDyw_6PM-Dama',
      { auth: { detectSessionInUrl: true, persistSession: true } }
    );
    const form=document.getElementById('form'), submit=document.getElementById('submit'), status=document.getElementById('status'), intro=document.getElementById('intro'), password=document.getElementById('password'), confirm=document.getElementById('confirm');
    function show(message,kind=''){status.textContent=message;status.className=`status show ${kind}`}
    supabase.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')show('Reset link verified. Choose your new password below.','good')});
    async function ready(){
      await new Promise(r=>setTimeout(r,120));
      const {data,error}=await supabase.auth.getSession();
      if(error||!data.session){show('This reset link is missing, invalid, or expired. Return to The Forge app and request a new password reset email.','error');form.style.display='none';intro.textContent='We could not verify this password reset request.'}
    }
    form.addEventListener('submit',async(event)=>{
      event.preventDefault();
      if(password.value.length<8)return show('Please use at least 8 characters.','error');
      if(password.value!==confirm.value)return show('The two passwords do not match.','error');
      submit.disabled=true;submit.textContent='UPDATING…';
      const {error}=await supabase.auth.updateUser({password:password.value});
      if(error){submit.disabled=false;submit.textContent='SET NEW PASSWORD';return show(error.message,'error')}
      await supabase.auth.signOut();form.style.display='none';intro.textContent='Your password has been changed.';show('Password updated successfully. Return to The Forge app and sign in with your new password.','good');
    });
    ready();
  </script>
</body>
</html>
